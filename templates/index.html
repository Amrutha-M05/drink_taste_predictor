<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧃 Drink Taste Predictor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 40px;
        }

        .input-section, .results-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
        }

        .input-section h2, .results-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #764ba2;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .value-display {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 10px;
        }

        .color-preview {
            width: 100%;
            height: 60px;
            border-radius: 8px;
            margin-top: 10px;
            border: 3px solid #ddd;
        }

        .rgb-inputs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .rgb-inputs input {
            text-align: center;
        }

        .predict-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .results-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .prediction-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .prediction-result {
            font-size: 3em;
            margin: 20px 0;
        }

        .liked {
            color: #28a745;
        }

        .not-liked {
            color: #dc3545;
        }

        .model-predictions {
            display: grid;
            gap: 15px;
        }

        .model-pred {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .confidence-bar {
            width: 100%;
            height: 25px;
            background: #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: width 0.5s ease;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧃 Drink Taste Predictor</h1>
            <p>Predict if a drink will be liked using Machine Learning</p>
        </div>

        <div class="main-content">
            <div class="input-section">
                <h2>🎨 Drink Properties</h2>
                
                <div class="form-group">
                    <label>
                        🍯 Sweetness Level
                        <span class="value-display" id="sweetnessValue">5</span>
                    </label>
                    <input type="range" id="sweetness" min="1" max="10" value="5">
                </div>

                <div class="form-group">
                    <label>🎨 Drink Color (RGB)</label>
                    <div class="rgb-inputs">
                        <input type="number" id="r" min="0" max="255" value="255" placeholder="R">
                        <input type="number" id="g" min="0" max="255" value="180" placeholder="G">
                        <input type="number" id="b" min="0" max="255" value="100" placeholder="B">
                    </div>
                    <div class="color-preview" id="colorPreview"></div>
                </div>

                <div class="form-group">
                    <label>
                        🌡️ Temperature (°C)
                        <span class="value-display" id="tempValue">10°C</span>
                    </label>
                    <input type="range" id="temperature" min="0" max="100" value="10">
                </div>

                <div class="form-group">
                    <label>
                        📝 Number of Ingredients
                        <span class="value-display" id="ingredientsValue">3</span>
                    </label>
                    <input type="range" id="ingredients" min="1" max="10" value="3">
                </div>

                <button class="predict-btn" onclick="predictTaste()">
                    🔮 Predict Taste
                </button>
            </div>

            <div class="results-section">
                <h2>📊 Prediction Results</h2>
                
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 10px; color: #666;">Analyzing...</p>
                </div>

                <div id="results" style="display: none;">
                    <div class="prediction-card">
                        <h3>Overall Prediction</h3>
                        <div class="prediction-result" id="overallResult">-</div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" id="confidenceBar">0%</div>
                        </div>
                    </div>

                    <div class="prediction-card">
                        <h3>Model Predictions</h3>
                        <div class="model-predictions">
                            <div class="model-pred">
                                <span>🌳 Decision Tree</span>
                                <span id="dtResult">-</span>
                            </div>
                            <div class="model-pred">
                                <span>🌲 Random Forest</span>
                                <span id="rfResult">-</span>
                            </div>
                            <div class="model-pred">
                                <span>🎯 SVM</span>
                                <span id="svmResult">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sweetness').addEventListener('input', function() {
            document.getElementById('sweetnessValue').textContent = this.value;
        });

        document.getElementById('temperature').addEventListener('input', function() {
            document.getElementById('tempValue').textContent = this.value + '°C';
        });

        document.getElementById('ingredients').addEventListener('input', function() {
            document.getElementById('ingredientsValue').textContent = this.value;
        });

        function updateColorPreview() {
            const r = document.getElementById('r').value;
            const g = document.getElementById('g').value;
            const b = document.getElementById('b').value;
            document.getElementById('colorPreview').style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }

        document.getElementById('r').addEventListener('input', updateColorPreview);
        document.getElementById('g').addEventListener('input', updateColorPreview);
        document.getElementById('b').addEventListener('input', updateColorPreview);
        updateColorPreview();

        async function predictTaste() {
            const data = {
                sweetness: parseInt(document.getElementById('sweetness').value),
                r: parseInt(document.getElementById('r').value),
                g: parseInt(document.getElementById('g').value),
                b: parseInt(document.getElementById('b').value),
                temperature: parseInt(document.getElementById('temperature').value),
                ingredients: parseInt(document.getElementById('ingredients').value)
            };

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('results').style.display = 'flex';

                const liked = result.overall_prediction === 1;
                document.getElementById('overallResult').innerHTML = 
                    `${liked ? '👍' : '👎'} <span class="${liked ? 'liked' : 'not-liked'}">${liked ? 'LIKED' : 'NOT LIKED'}</span>`;
                
                document.getElementById('confidenceBar').style.width = result.confidence + '%';
                document.getElementById('confidenceBar').textContent = result.confidence.toFixed(1) + '%';

                document.getElementById('dtResult').innerHTML = 
                    result.models.decision_tree === 1 ? '👍' : '👎';
                document.getElementById('rfResult').innerHTML = 
                    result.models.random_forest === 1 ? '👍' : '👎';
                document.getElementById('svmResult').innerHTML = 
                    result.models.svm === 1 ? '👍' : '👎';

            } catch (error) {
                alert('Error: ' + error.message);
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
